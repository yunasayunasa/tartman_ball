<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#83cce5" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta
      name="description"
      content="空を駆け抜け、タルトを集めよう。スマホを傾けて6つの空中コースを旅する3Dアクションゲーム。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:site_name" content="Sky Tart Roll" />
    <meta property="og:title" content="Sky Tart Roll｜空を駆ける3Dアクションゲーム" />
    <meta
      property="og:description"
      content="ダッシュで空を駆け抜け、6つのコースに散らばるタルトを集めよう。"
    />
    <meta property="og:url" content="https://yunasayunasa.github.io/tartman_ball/" />
    <meta property="og:image" content="https://yunasayunasa.github.io/tartman_ball/ogp.jpg" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta property="og:image:alt" content="空中コースを透明なボールで駆け抜けるSky Tart Roll" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sky Tart Roll｜空を駆ける3Dアクションゲーム" />
    <meta
      name="twitter:description"
      content="ダッシュで空を駆け抜け、6つのコースに散らばるタルトを集めよう。"
    />
    <meta name="twitter:image" content="https://yunasayunasa.github.io/tartman_ball/ogp.jpg" />
    <title>Sky Tart Roll</title>
  </head>
  <body>
    <canvas id="world" aria-label="空に浮かぶ3Dボールコース"></canvas>
    <main id="ui">
      <section class="panel loading">
        <span class="eyebrow">SKY TART ROLL</span>
        <h1>空の旅を準備中…</h1>
        <p>コースと物理エンジンを読み込んでいます</p>
      </section>
    </main>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="joystick" hidden aria-label="移動スティック"><span></span><small>MOVE</small></div>
    <div id="landscape">
      <span>↻</span>
      <h2>スマホを縦にしてね</h2>
      <p>戻ったら「再開」で続きを遊べます。</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
